# fly.toml app configuration file generated for cpu-sim-basic on 2026-09-09T18:32:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cpu-sim-basic'
primary_region = 'lhr'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
